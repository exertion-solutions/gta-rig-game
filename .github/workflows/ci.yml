# Solo verificación: typecheck, tests unitarios y build. NO publica ni despliega (publicar requiere autorización, ver NOTICE.md).
# Nota: los GLB del visor están en el repo; check-assets (prebuild) falla si faltan o cambió un hash.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
